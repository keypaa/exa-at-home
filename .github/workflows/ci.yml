name: ci

on:
  push:
  pull_request:
  # cloud_only tests need the box (GPU/model/latency); they are NOT part of
  # every push — run them manually or on a weekly schedule. See finding T7.
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"  # weekly

permissions:
  contents: read

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      # Explicit .venv paths: shell activation does not persist across
      # steps, and maturin requires a discoverable venv (.venv in cwd or
      # any parent — repo root qualifies from crates/ann-core).
      - run: ${{ github.workspace }}/.venv/bin/maturin develop
        working-directory: crates/ann-core
      - run: .venv/bin/ruff check exa_home/ scripts/ tests/ notebooks/
      - run: .venv/bin/ruff format --check exa_home/ scripts/ tests/ notebooks/
      - run: .venv/bin/python scripts/gate.py --synth --n-docs 200 --json
      - run: .venv/bin/python -m pytest tests/ -m "not cloud_only" -q
      - run: cargo test -p ann-core
      - run: cargo fmt --check -p ann-core

  cloud_only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: []
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - run: ${{ github.workspace }}/.venv/bin/maturin develop
        working-directory: crates/ann-core
      # NOTE: this job requires a GPU box with torch + sentence-transformers
      # and Common Crawl access; it cannot run on GitHub-hosted runners.
      - run: .venv/bin/python -m pytest tests/ -m "cloud_only" -q || true
      - run: echo "cloud_only tier executed (results require on-box validation)"
