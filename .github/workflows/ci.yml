name: ci

on: [push, pull_request]

jobs:
  tier0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      # Explicit .venv paths: shell activation does not persist across
      # steps, and maturin requires a discoverable venv (.venv in cwd or
      # any parent — repo root qualifies from crates/ann-core).
      - run: ${{ github.workspace }}/.venv/bin/maturin develop
        working-directory: crates/ann-core
      - run: .venv/bin/ruff check exa_home/ scripts/ tests/ notebooks/
      - run: .venv/bin/ruff format --check exa_home/ scripts/ tests/ notebooks/
      - run: .venv/bin/python scripts/gate.py --synth --n-docs 200 --json
      - run: .venv/bin/python -m pytest tests/ -m "not cloud_only" -q
      - run: cargo test -p ann-core
      - run: cargo fmt --check -p ann-core
